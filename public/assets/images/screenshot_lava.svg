<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <!-- Dark Volcanic Gradient matching BiomeTheme.volcano -->
    <linearGradient id="volcanoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B0E0C"/>
      <stop offset="60%" stop-color="#1B0706"/>
      <stop offset="100%" stop-color="#0F0504"/>
    </linearGradient>

    <!-- Molten Lava Lake -->
    <linearGradient id="lavaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="25%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <!-- Volcanic Obsidian Rock -->
    <linearGradient id="obsidianGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D201A"/>
      <stop offset="100%" stop-color="#180C0A"/>
    </linearGradient>

    <!-- Neon Yellow Bridge Glow -->
    <filter id="neonYellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Car Body Gradient -->
    <linearGradient id="carBodyGradLava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#70D6FF"/>
      <stop offset="40%" stop-color="#38B6FF"/>
      <stop offset="100%" stop-color="#0072C6"/>
    </linearGradient>
  </defs>

  <!-- 1. Volcanic Cave Background -->
  <rect width="720" height="1280" fill="url(#volcanoSky)"/>

  <!-- Cave Stalactites hanging from ceiling -->
  <polygon points="40,0 80,140 120,0" fill="#240D0B"/>
  <polygon points="180,0 230,220 280,0" fill="#2E100D"/>
  <polygon points="420,0 460,180 500,0" fill="#240D0B"/>
  <polygon points="580,0 630,260 680,0" fill="#2E100D"/>

  <!-- Floating Orange Ember Particles -->
  <circle cx="120" cy="400" r="4" fill="#F97316" opacity="0.8"/>
  <circle cx="280" cy="520" r="3" fill="#FBBF24" opacity="0.9"/>
  <circle cx="480" cy="380" r="5" fill="#EF4444" opacity="0.7"/>
  <circle cx="640" cy="480" r="3" fill="#FBBF24" opacity="0.85"/>
  <circle cx="360" cy="700" r="4" fill="#F97316" opacity="0.9"/>

  <!-- 2. Bottom Molten Lava Pit -->
  <rect x="0" y="980" width="720" height="300" fill="url(#lavaGrad)"/>
  <!-- Bubbling lava crests -->
  <ellipse cx="200" cy="980" rx="80" ry="18" fill="#FDE68A" opacity="0.8"/>
  <ellipse cx="450" cy="990" rx="100" ry="22" fill="#FDE68A" opacity="0.7"/>
  <ellipse cx="620" cy="978" rx="60" ry="14" fill="#FEF08A" opacity="0.85"/>

  <!-- 3. Obsidian Cliff Platforms -->
  <!-- Left Cliff -->
  <path d="M 0,780 L 160,780 L 160,1280 L 0,1280 Z" fill="url(#obsidianGrad)"/>
  <rect x="0" y="780" width="160" height="12" fill="#78350F"/>
  <rect x="0" y="780" width="160" height="4" fill="#F59E0B"/>

  <!-- Right Cliff -->
  <path d="M 560,700 L 720,700 L 720,1280 L 560,1280 Z" fill="url(#obsidianGrad)"/>
  <rect x="560" y="700" width="160" height="12" fill="#78350F"/>
  <rect x="560" y="700" width="160" height="4" fill="#F59E0B"/>

  <!-- Finish Flag on Right Cliff -->
  <g transform="translate(630, 600)">
    <rect x="0" y="0" width="8" height="100" rx="3" fill="#E2E8F0"/>
    <g transform="translate(8, 0)">
      <rect x="0" y="0" width="56" height="36" fill="#0F172A"/>
      <rect x="0" y="0" width="14" height="9" fill="#FFFFFF"/>
      <rect x="28" y="0" width="14" height="9" fill="#FFFFFF"/>
      <rect x="14" y="9" width="14" height="9" fill="#FFFFFF"/>
      <rect x="42" y="9" width="14" height="9" fill="#FFFFFF"/>
      <rect x="0" y="18" width="14" height="9" fill="#FFFFFF"/>
      <rect x="28" y="18" width="14" height="9" fill="#FFFFFF"/>
      <rect x="14" y="27" width="14" height="9" fill="#FFFFFF"/>
      <rect x="42" y="27" width="14" height="9" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- 4. Dangerous Spinning Saw Gear Obstacle -->
  <g transform="translate(390, 810)">
    <!-- Gear Outer Teeth (12 teeth) -->
    <circle cx="0" cy="0" r="54" fill="#EF4444" stroke="#B91C1C" stroke-width="4"/>
    <!-- 8 Saw Teeth cutouts -->
    <path d="M -60,0 L -50,-15 L -40,0 Z M 60,0 L 50,15 L 40,0 Z M 0,-60 L 15,-50 L 0,-40 Z M 0,60 L -15,50 L 0,40 Z" fill="#EF4444"/>
    <circle cx="0" cy="0" r="32" fill="#7F1D1D"/>
    <circle cx="0" cy="0" r="16" fill="#475569"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <!-- Hazard Warning Label -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="8 6"/>
  </g>

  <!-- 5. Hand-Drawn Glowing Neon Line Bridge (Arching over gear) -->
  <path d="M 140,780 C 230,730 310,610 400,610 C 480,610 520,660 580,705"
        fill="none" stroke="#FFF75E" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.3" filter="url(#neonYellowGlow)"/>
  <path d="M 140,780 C 230,730 310,610 400,610 C 480,610 520,660 580,705"
        fill="none" stroke="#FFF75E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 140,780 C 230,730 310,610 400,610 C 480,610 520,660 580,705"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 6. Cute Blue Toy Car (#7) in Mid-Flight / Driving along Bridge -->
  <g transform="translate(290, 645) rotate(-14)">
    <!-- Exhaust Fire Particles -->
    <g transform="translate(-56, 10)">
      <ellipse cx="-10" cy="0" rx="14" ry="7" fill="#F97316"/>
      <ellipse cx="-4" cy="0" rx="9" ry="5" fill="#FDE047"/>
      <ellipse cx="2" cy="0" rx="5" ry="3" fill="#FFFFFF"/>
    </g>

    <!-- Car Body -->
    <rect x="-48" y="-24" width="96" height="44" rx="16" fill="url(#carBodyGradLava)"/>
    <rect x="-45" y="-22" width="90" height="20" rx="10" fill="#70D6FF" opacity="0.6"/>

    <!-- Cabin / Windshield -->
    <path d="M -22,-24 L -10,-46 Q 0,-48 24,-46 L 36,-24 Z" fill="#E0F2FE"/>

    <!-- Yellow Roof Hat -->
    <rect x="-12" y="-52" width="38" height="10" rx="4" fill="#FFD166"/>

    <!-- Big Expressive Cartoon Eyes (Looking determined!) -->
    <circle cx="10" cy="-34" r="8" fill="#FFFFFF"/>
    <circle cx="13" cy="-34" r="4.5" fill="#0F172A"/>
    <circle cx="15" cy="-36" r="2" fill="#FFFFFF"/>

    <circle cx="28" cy="-34" r="8" fill="#FFFFFF"/>
    <circle cx="31" cy="-34" r="4.5" fill="#0F172A"/>
    <circle cx="33" cy="-36" r="2" fill="#FFFFFF"/>

    <!-- Number 7 on Door -->
    <circle cx="-14" cy="-2" r="14" fill="#FFFFFF"/>
    <text x="-14" y="4" font-family="'Fredoka', sans-serif" font-size="16" font-weight="900" fill="#0072C6" text-anchor="middle">7</text>

    <!-- Wheels (Spinning with motion blur) -->
    <g transform="translate(-28, 20)">
      <circle cx="0" cy="0" r="18" fill="#1E293B"/>
      <circle cx="0" cy="0" r="11" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="5" fill="#38B6FF"/>
    </g>
    <g transform="translate(28, 20)">
      <circle cx="0" cy="0" r="18" fill="#1E293B"/>
      <circle cx="0" cy="0" r="11" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="5" fill="#38B6FF"/>
    </g>
  </g>

  <!-- 7. REAL FLUTTER DRIVING HUD -->
  <!-- Top Left: Home Button + Redraw Button -->
  <g transform="translate(36, 50)">
    <!-- Home -->
    <circle cx="26" cy="23" r="24" fill="#475569"/>
    <path d="M 18,25 L 26,17 L 34,25 L 34,30 Q 34,31 33,31 L 19,31 Q 18,31 18,30 Z" fill="#FFFFFF"/>
    <!-- Redraw Button -->
    <g transform="translate(60, 0)">
      <rect x="0" y="0" width="100" height="46" rx="23" fill="#F97316"/>
      <text x="50" y="29" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Redraw</text>
    </g>
  </g>

  <!-- Top Right: Reset Button -->
  <g transform="translate(584, 50)">
    <rect x="0" y="0" width="100" height="46" rx="23" fill="#0284C7"/>
    <text x="50" y="29" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reset</text>
  </g>

  <!-- Top Center: Level Title & Ink Capsule -->
  <g transform="translate(360, 60)">
    <rect x="-130" y="-15" width="260" height="34" rx="17" fill="#1E293B" opacity="0.9"/>
    <text x="0" y="8" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Level 16: Magma Rush</text>
  </g>

  <!-- Bottom Floating Driving Pedals (BRAKE and GAS) -->
  <!-- Bottom Left: BRAKE Pedal (Orange) -->
  <g transform="translate(48, 1140)">
    <rect x="0" y="8" width="160" height="78" rx="26" fill="#C2410C"/>
    <rect x="0" y="0" width="160" height="78" rx="26" fill="#F97316"/>
    <rect x="8" y="4" width="144" height="18" rx="9" fill="#FFFFFF" opacity="0.25"/>
    <text x="80" y="48" font-family="'Fredoka', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">🛑 BRAKE</text>
  </g>

  <!-- Bottom Right: GAS Pedal (Green) -->
  <g transform="translate(512, 1140)">
    <rect x="0" y="8" width="160" height="78" rx="26" fill="#15803D"/>
    <rect x="0" y="0" width="160" height="78" rx="26" fill="#22C55E"/>
    <rect x="8" y="4" width="144" height="18" rx="9" fill="#FFFFFF" opacity="0.25"/>
    <text x="80" y="48" font-family="'Fredoka', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">⚡ GAS</text>
  </g>
</svg>
